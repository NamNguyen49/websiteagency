<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;display=swap');
      .text-hnt {
        font-family: 'Orbitron', 'Exo', 'Jura', sans-serif;
        font-size: 95px;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .text-sol {
        font-family: 'Orbitron', 'Exo', 'Jura', sans-serif;
        font-size: 70px;
        font-weight: 800;
      }
      .text-glow {
        fill: #4dafe6;
      }
    </style>
  </defs>

  <g transform="translate(15, 0)">
    <!-- Arcs centered at x=310, y=100 -->
    <!-- Top Arc (Cyan Glow) -->
    <path d="M 210 65 Q 310 -25 410 65 Q 310 20 210 65 Z" fill="#4dafe6" />
    <path d="M 200 55 Q 310 -40 420 55" fill="none" stroke="#4dafe6" stroke-width="4" stroke-linecap="round" />

    <!-- Bottom Arc (Smooth Blue Glow) -->
    <path d="M 210 135 Q 310 225 410 135 Q 310 180 210 135 Z" fill="#3282b8" />
    <path d="M 200 145 Q 310 240 420 145" fill="none" stroke="#3282b8" stroke-width="4" stroke-linecap="round" />

    <!-- Cyan Shadow / Offset for text -->
    <g transform="translate(4, 5)">
      <text x="15" y="130" class="text-hnt text-glow">HNT</text>
      <text x="235" y="130" class="text-sol text-glow">solutions</text>
    </g>

    <!-- Main white text -->
    <text x="15" y="130" class="text-hnt" fill="#fdfdfd">HNT</text>
    <text x="235" y="130" class="text-sol" fill="#fdfdfd">solutions</text>
  </g>
</svg>
