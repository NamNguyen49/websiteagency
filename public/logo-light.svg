<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#347cb8"/>
      <stop offset="48%" stop-color="#347cb8"/>
      <stop offset="52%" stop-color="#124883"/>
      <stop offset="100%" stop-color="#124883"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;display=swap');
      .text-hnt {
        font-family: 'Orbitron', 'Exo', 'Jura', sans-serif;
        font-size: 95px;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .text-sol {
        font-family: 'Orbitron', 'Exo', 'Jura', sans-serif;
        font-size: 70px;
        font-weight: 800;
      }
      .txt-shadow {
        fill: #66aede;
      }
      .txt-bg {
        stroke: #ffffff;
        stroke-width: 8px;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </defs>

  <g transform="translate(15, 0)">
    <!-- Arcs centered at x=310, y=100 -->
    <!-- Top Arc (Light Blue) -->
    <path d="M 210 65 Q 310 -25 410 65 Q 310 20 210 65 Z" fill="#66aede" />
    <path d="M 200 55 Q 310 -40 420 55" fill="none" stroke="#66aede" stroke-width="4" stroke-linecap="round" />

    <!-- Bottom Arc (Dark Blue) -->
    <path d="M 210 135 Q 310 225 410 135 Q 310 180 210 135 Z" fill="#124883" />
    <path d="M 200 145 Q 310 240 420 145" fill="none" stroke="#124883" stroke-width="4" stroke-linecap="round" />

    <!-- Shadow text -->
    <g transform="translate(4, 5)">
      <text x="15" y="130" class="text-hnt txt-shadow">HNT</text>
      <text x="235" y="130" class="text-sol txt-shadow">solutions</text>
    </g>

    <!-- White background separation -->
    <text x="15" y="130" class="text-hnt txt-bg">HNT</text>
    <text x="235" y="130" class="text-sol txt-bg">solutions</text>

    <!-- Main text -->
    <text x="15" y="130" class="text-hnt" fill="url(#textGrad)">HNT</text>
    <text x="235" y="130" class="text-sol" fill="url(#textGrad)">solutions</text>
  </g>
</svg>
